[package]
name = "cdown"
version = "0.1.0"
description = "countdown desktop widget"
authors = ["py"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "=1.0.154"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
toml = "=0.8.2"
chrono = "=0.4.45"
log = "=0.4.34"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-log = "=2.10.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
